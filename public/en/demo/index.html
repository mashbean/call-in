<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050b17" />
    <link rel="icon" type="image/svg+xml" href="/brand/call-in-mark.svg" />
    <title>Call-in permanent demo</title>
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body data-locale="en">
    <header class="demo-toolbar">
      <a class="demo-brand" href="/en/"><img src="/brand/call-in-mark.svg" alt="" /><span><em>Call-in</em><b>Permanent demo</b></span></a>
      <div class="demo-state"><i></i><span>Public demo · resets daily</span></div>
      <nav aria-label="Demo tools">
        <a class="toolbar-primary" href="/en/#create">Use my slides</a>
        <a href="/demo/" lang="zh-Hant-TW">中文</a>
        <button type="button" data-fullscreen>Fullscreen</button>
      </nav>
    </header>
    <main class="demo-layout">
      <section class="deck-pane" aria-label="Sample deck">
        <iframe src="https://mashbean.net/decks/isf-0427/" title="Call-in sample deck" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>
      <aside class="response-pane" aria-label="Live Call-in demo dashboard">
        <iframe src="/en/demo/dashboard/" title="Call-in permanent demo dashboard" allow="fullscreen"></iframe>
      </aside>
    </main>
    <script type="module" src="/demo/demo.js"></script>
  </body>
</html>
