<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <title>田間現場管理</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/moderate/moderate.css" />
  </head>
  <body class="moderator-page">
    <header class="moderator-header">
      <div><div class="eyebrow">現場管理</div><h1>維持可用的討論空間</h1></div>
      <div class="moderator-status" data-moderator-status>尚未登入</div>
    </header>
    <main class="moderator-main">
      <section class="moderator-login" data-login-panel>
        <h2>開啟管理工具</h2>
        <p>請使用獨立的管理權杖。這組權杖無法匯出或重設活動資料。</p>
        <form data-login-form>
          <label for="moderator-token">管理權杖</label>
          <input id="moderator-token" name="token" type="password" minlength="24" required autocomplete="current-password" />
          <button class="primary" type="submit">繼續</button>
          <span data-login-message aria-live="polite"></span>
        </form>
      </section>

      <div data-moderator-app hidden>
        <section class="session-controls">
          <div><div class="eyebrow">場次模式</div><h2>控制新問題的進場方式</h2></div>
          <div class="mode-grid" data-mode-grid>
            <button data-mode="open">開放</button>
            <button data-mode="slow">慢速</button>
            <button data-mode="approval">先審後發</button>
            <button data-mode="paused">暫停</button>
            <button data-mode="closed">關閉</button>
          </div>
        </section>

        <section class="moderator-queue">
          <div class="moderator-section-head">
            <div><div class="eyebrow">問題佇列</div><h2>最新與暫緩問題優先</h2></div>
            <button class="quiet" type="button" data-refresh>重新整理</button>
          </div>
          <div class="moderator-questions" data-moderator-questions></div>
        </section>
      </div>
    </main>
    <script type="module" src="/moderate/moderate.js"></script>
  </body>
</html>
