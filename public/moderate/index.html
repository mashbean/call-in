<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <link rel="icon" type="image/svg+xml" href="/brand/call-in-mark.svg" />
    <title>Call-in moderation</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/moderate/moderate.css" />
  </head>
  <body class="moderator-page">
    <header class="moderator-header">
      <div><div class="eyebrow" data-zh="主持工具">MODERATOR</div><h1 data-zh="維持有用的現場討論">Keep the room useful</h1></div>
      <div class="moderator-status" data-moderator-status data-zh="尚未連線">Signed out</div>
    </header>
    <main class="moderator-main">
      <section class="moderator-login" data-login-panel>
        <h2 data-zh="開啟主持控制台">Open the moderation controls</h2>
        <p data-zh="請使用獨立的主持存取碼；主持人無法匯出或重設活動資料。">Use the separate moderator token. It cannot export or reset event data.</p>
        <form data-login-form>
          <label for="moderator-token" data-zh="主持存取碼">Moderator token</label>
          <input id="moderator-token" name="token" type="password" minlength="24" required autocomplete="current-password" />
          <button class="primary" type="submit" data-zh="繼續">Continue</button>
          <span data-login-message aria-live="polite"></span>
        </form>
      </section>

      <div data-moderator-app hidden>
        <section class="session-controls">
          <div><div class="eyebrow" data-zh="活動狀態">SESSION MODE</div><h2 data-zh="控制新的提問">Control new questions</h2></div>
          <div class="mode-grid" data-mode-grid>
            <button data-mode="open" data-zh="開放">Open</button>
            <button data-mode="slow" data-zh="慢速">Slow</button>
            <button data-mode="approval" data-zh="需審核">Approval</button>
            <button data-mode="paused" data-zh="暫停">Pause</button>
            <button data-mode="closed" data-zh="關閉">Close</button>
          </div>
        </section>

        <section class="moderator-queue">
          <div class="moderator-section-head">
            <div><div class="eyebrow" data-zh="問題佇列">QUESTION QUEUE</div><h2 data-zh="最新與暫不公開的問題優先">Newest and held first</h2></div>
            <button class="quiet" type="button" data-refresh data-zh="重新整理">Refresh</button>
          </div>
          <div class="moderator-questions" data-moderator-questions></div>
        </section>
      </div>
    </main>
    <script type="module" src="/moderate/moderate.js"></script>
  </body>
</html>
