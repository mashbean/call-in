      <stop offset="0.55" stop-color="#0a1027" />
      <stop offset="1" stop-color="#050914" />
    </radialGradient>
    <linearGradient id="curve" x1="290" y1="402" x2="910" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c35ff" />
