<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Call-in</title>
  <desc id="desc">Call-in bell curve logo on a dark gradient background</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="translate(600 315) rotate(90) scale(520 790)" gradientUnits="userSpaceOnUse">
