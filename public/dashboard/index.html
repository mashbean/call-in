<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <link rel="icon" type="image/png" href="/brand/call-in-favicon.png" />
    <title>Call-in Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <div class="eyebrow" data-config="eyebrow">CALL-IN</div>
        <h1 data-config="dashboardTitle">Live audience</h1>
      </div>
      <button class="dashboard-join" type="button" data-qr-open aria-haspopup="dialog" aria-controls="qr-modal" aria-expanded="false" title="Click to enlarge the QR code" data-zh-title="點擊放大 QR Code">
        <img data-qr-image src="/api/qr.svg" alt="Scan to join the live audience page" data-zh-aria="掃描 QR Code 加入現場互動" />
        <span><b data-zh="掃描加入">Scan to join</b><small data-zh="難度 · 問題 · 即時反應">Difficulty · questions · emoji</small></span>
      </button>
      <div class="live-status dashboard-connection" data-status data-zh-tail="連線中"><span></span>Connecting</div>
      <nav class="dashboard-tabs" role="tablist" aria-label="Dashboard views" data-zh-aria="儀表板畫面">
        <button class="active" type="button" role="tab" aria-selected="true" data-dashboard-tab="live" data-zh="現場">Live</button>
        <button type="button" role="tab" aria-selected="false" data-dashboard-tab="polls"><span data-zh="投票結果">Poll results</span> <span data-poll-total>0</span></button>
      </nav>
    </header>
    <main class="dashboard-main">
      <div class="dashboard-panel" role="tabpanel" data-dashboard-panel="live">
        <section class="dashboard-section dashboard-difficulty difficulty-card">
          <div class="dashboard-section-head"><div><div class="eyebrow" data-zh="理解難度">DIFFICULTY</div><h2 data-zh="現場理解難度">Live difficulty</h2></div><span data-difficulty-total data-zh="等待第一筆回覆">Waiting for the first response</span></div>
          <div class="difficulty-chart" aria-label="Live difficulty distribution" data-zh-aria="即時理解難度分布" role="img">
            <svg viewBox="0 0 600 210" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path class="difficulty-grid-line" d="M30 172 H570" />
              <path data-difficulty-area class="difficulty-area" />
              <path data-difficulty-line class="difficulty-line" />
              <g data-difficulty-points></g>
            </svg>
            <div class="difficulty-counts" data-difficulty-counts></div>
          </div>
          <div class="dashboard-reaction-hint"><span data-zh="即時反應">Live reactions</span><div data-reaction-legend aria-hidden="true"></div></div>
        </section>
        <section class="dashboard-section">
          <div class="dashboard-section-head"><div><div class="eyebrow" data-zh="問題池">Q&amp;A POOL</div><h2 data-config="question.title">Ask anytime</h2></div><div class="question-session-meta"><b data-session-mode>OPEN</b><span data-question-count data-zh="0 個問題">0 questions</span></div></div>
          <div id="dashboard-questions" class="dashboard-questions"></div>
        </section>
      </div>
      <div class="dashboard-panel" role="tabpanel" data-dashboard-panel="polls" hidden>
        <section class="dashboard-section">
          <div class="dashboard-section-head"><div><div class="eyebrow" data-zh="投票">POLL</div><h2 data-zh="投票結果">Poll results</h2></div></div>
          <div id="dashboard-polls" class="dashboard-polls"></div>
        </section>
      </div>
    </main>
    <a class="dashboard-open" data-audience-url href="/" target="_blank" rel="noreferrer" data-zh="開啟觀眾頁 ↗">Open audience page ↗</a>
    <div class="reaction-stage" data-reaction-stage aria-live="polite"></div>
    <div class="qr-modal" id="qr-modal" data-qr-modal role="dialog" aria-modal="true" aria-labelledby="qr-modal-title" hidden>
      <div class="qr-modal-card">
        <button class="qr-modal-close" type="button" data-qr-close aria-label="Close QR code dialog" data-zh-aria="關閉 QR Code 視窗">×</button>
        <img data-qr-image src="/api/qr.svg" alt="Scan to join the live audience page" data-zh-aria="掃描 QR Code 加入現場互動" />
        <b id="qr-modal-title" data-zh="掃描加入">Scan to join</b>
        <a class="qr-modal-link" data-qr-url data-audience-url href="/" target="_blank" rel="noreferrer"></a>
        <span class="qr-modal-hint" data-zh="按 Escape 或關閉按鈕離開">Press Escape or use the close button</span>
      </div>
    </div>
    <script type="module" src="/dashboard/dashboard.js"></script>
  </body>
</html>
