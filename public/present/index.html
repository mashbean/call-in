<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050b17" />
    <link rel="icon" type="image/svg+xml" href="/brand/call-in-mark.svg" />
    <title>Call-in 講者頁</title>
    <link rel="stylesheet" href="/present/present.css" />
  </head>
  <body class="present-page">
    <header class="present-toolbar">
      <div class="present-brand"><img src="/brand/call-in-mark.svg" alt="" /><span><em>Call-in</em><b data-event-title>講者頁</b></span></div>
      <div class="present-status" data-present-status>正在載入簡報…</div>
      <nav aria-label="講者工具">
        <a data-open-deck href="#" target="_blank" rel="noreferrer">另開簡報</a>
        <a data-audience-link href="/" target="_blank" rel="noreferrer">觀眾頁</a>
        <a data-moderator-link href="/moderate/" target="_blank" rel="noreferrer">管理</a>
        <button type="button" data-fullscreen>全螢幕</button>
        <button type="button" data-toolbar-toggle aria-expanded="true">收起工具列</button>
      </nav>
    </header>
    <button class="toolbar-peek" type="button" data-toolbar-peek aria-label="顯示講者工具列" title="顯示講者工具列"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m3.5 5.75 4.5 4.5 4.5-4.5" /></svg><span data-toolbar-peek-label>工具列</span></button>
    <button class="dashboard-toggle" type="button" data-dashboard-toggle aria-controls="present-dashboard" aria-expanded="true"><span data-dashboard-toggle-label>隱藏互動</span><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg></button>
    <main class="present-stage">
      <section class="deck-pane" aria-label="簡報">
        <iframe data-deck-frame title="簡報" allow="fullscreen; autoplay; clipboard-write" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <p class="embed-note" data-embed-note>簡報區若保持空白，原網站可能禁止內嵌；請使用上方「另開簡報」。</p>
      </section>
      <section class="dashboard-pane" id="present-dashboard" aria-label="現場互動">
        <iframe data-dashboard-frame src="/dashboard/" title="現場互動 dashboard" allow="clipboard-write"></iframe>
      </section>
    </main>
    <script type="module" src="/present/present.js"></script>
  </body>
</html>
