<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Deck Kit device mockup</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1530px;
        height: 1000px;
        margin: 0;
        overflow: hidden;
        background: #070d1d;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        position: relative;
        color: #f4f7ff;
        background:
          radial-gradient(circle at 69% 28%, rgba(255, 79, 154, 0.17), transparent 32%),
          radial-gradient(circle at 24% 77%, rgba(53, 220, 255, 0.14), transparent 36%),
          linear-gradient(145deg, #050a16 0%, #0a1328 52%, #101433 100%);
      }

      body::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(rgba(53, 220, 255, 0.065) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 220, 255, 0.065) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 96%);
      }

      .brand {
        position: absolute;
        top: 74px;
        left: 94px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 18px;
        color: #ff5ba3;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.23em;
      }

      .brand::before {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #b9f24a;
        box-shadow: 0 0 0 7px rgba(185, 242, 74, 0.12), 0 0 24px rgba(185, 242, 74, 0.5);
        content: "";
      }

      .floor-glow {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 60px;
        height: 210px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(53, 220, 255, 0.2), transparent 70%);
        filter: blur(20px);
        transform: perspective(500px) rotateX(68deg);
      }

      .laptop {
        position: absolute;
        top: 164px;
        left: 390px;
        z-index: 2;
        width: 1080px;
        height: 700px;
        filter: drop-shadow(0 42px 48px rgba(0, 0, 0, 0.52));
      }

      .laptop-lid {
        position: absolute;
        top: 0;
        left: 25px;
        width: 1030px;
        height: 651px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 22px 22px 11px 11px;
        background: linear-gradient(145deg, #cbd1d9 0%, #7a8491 1.5%, #202734 3.5%, #080d16 7%, #070b13 100%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.05),
          inset 0 -8px 22px rgba(0, 0, 0, 0.42),
          0 0 0 1px rgba(0, 0, 0, 0.78);
      }

      .laptop-camera {
        position: absolute;
        top: 4px;
        left: 50%;
        z-index: 2;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #050912;
        box-shadow: inset 0 0 2px #3adfff;
        transform: translateX(-50%);
      }

      .laptop-screen {
        position: relative;
        width: 1010px;
        height: 631px;
        overflow: hidden;
        border-radius: 12px 12px 7px 7px;
        background: #050914;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9);
      }

      .laptop-screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .laptop-screen::after,
      .phone-screen::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        background: linear-gradient(125deg, rgba(255, 255, 255, 0.11), transparent 17%, transparent 74%, rgba(255, 255, 255, 0.035));
        mix-blend-mode: screen;
      }

      .laptop-base {
        position: absolute;
        bottom: 12px;
        left: 0;
        width: 1080px;
        height: 34px;
        clip-path: polygon(3% 0, 97% 0, 100% 64%, 97% 86%, 3% 86%, 0 64%);
        background: linear-gradient(to bottom, #e2e5e9 0%, #949ca7 29%, #4c5663 55%, #171d27 87%, #090d14 100%);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.78);
      }

      .laptop-base::after {
        position: absolute;
        top: 0;
        left: 45%;
        width: 10%;
        height: 5px;
        border-radius: 0 0 7px 7px;
        background: rgba(34, 40, 49, 0.72);
        content: "";
      }

      .phone {
        position: absolute;
        top: 184px;
        left: 58px;
        z-index: 3;
        width: 304px;
        height: 680px;
        padding: 12px;
        border: 2px solid rgba(255, 255, 255, 0.52);
        border-radius: 52px;
        background: linear-gradient(145deg, #b9c1cc 0%, #3b4554 4%, #0d1421 10%, #050913 100%);
        box-shadow:
          inset 0 0 0 3px rgba(255, 255, 255, 0.07),
          0 42px 58px rgba(0, 0, 0, 0.58),
          12px 5px 46px rgba(53, 220, 255, 0.08);
      }

      .phone::before {
        position: absolute;
        top: 121px;
        right: -5px;
        width: 4px;
        height: 82px;
        border-radius: 0 3px 3px 0;
        background: #656e7a;
        content: "";
      }

      .phone-screen {
        position: relative;
        width: 276px;
        height: 652px;
        overflow: hidden;
        border-radius: 40px;
        background: #070d1d;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .phone-screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .dynamic-island {
        position: absolute;
        top: 23px;
        left: 50%;
        z-index: 5;
        width: 92px;
        height: 27px;
        border-radius: 999px;
        background: #02040a;
        box-shadow: inset -16px 0 20px rgba(19, 29, 44, 0.52);
        transform: translateX(-50%);
      }

      .dynamic-island::after {
        position: absolute;
        top: 9px;
        right: 11px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #071525;
        box-shadow: inset 0 0 3px #2b62a3;
        content: "";
      }

      .device-label {
        position: absolute;
        right: 70px;
        bottom: 48px;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(235, 241, 255, 0.68);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .device-label span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #35dcff;
        box-shadow: 0 0 16px #35dcff;
      }
    </style>
  </head>
  <body>
    <div class="brand">LIVE DECK KIT</div>
    <div class="floor-glow"></div>

    <div class="laptop" aria-label="Presenter deck shown on a laptop">
      <div class="laptop-lid">
        <div class="laptop-camera"></div>
        <div class="laptop-screen">
          <img src="./demo-presenter.jpg" alt="Live Deck Kit presenter dashboard" />
        </div>
      </div>
      <div class="laptop-base"></div>
    </div>

    <div class="phone" aria-label="Audience interaction shown on a phone">
      <div class="phone-screen">
        <div class="dynamic-island"></div>
        <img src="./demo-audience.jpg" alt="Live Deck Kit audience page" />
      </div>
    </div>

    <div class="device-label"><span></span>Presenter + audience, one realtime room</div>
  </body>
</html>
