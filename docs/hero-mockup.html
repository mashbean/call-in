<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call-in device mockup</title>
    <link rel="stylesheet" href="../node_modules/devices.css/dist/devices.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1530px;
        height: 1000px;
        margin: 0;
        overflow: hidden;
        background: #070d1d;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        position: relative;
        color: #f4f7ff;
        background:
          radial-gradient(circle at 73% 36%, rgba(255, 79, 154, 0.15), transparent 34%),
          radial-gradient(circle at 24% 74%, rgba(53, 220, 255, 0.14), transparent 34%),
          linear-gradient(145deg, #050a16 0%, #0a1328 52%, #101433 100%);
      }

      body::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(rgba(53, 220, 255, 0.065) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 220, 255, 0.065) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 96%);
      }

      .brand {
        position: absolute;
        top: 72px;
        left: 74px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 18px;
        color: #ff5ba3;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.23em;
      }

      .brand::before {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #b9f24a;
        box-shadow: 0 0 0 7px rgba(185, 242, 74, 0.12), 0 0 24px rgba(185, 242, 74, 0.5);
        content: "";
      }

      .floor-glow {
        position: absolute;
        left: 140px;
        right: 140px;
        bottom: 72px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(53, 220, 255, 0.19), transparent 69%);
        filter: blur(20px);
        transform: perspective(500px) rotateX(68deg);
      }

      .phone-slot,
      .macbook-slot {
        position: absolute;
        z-index: 2;
      }

      .phone-slot {
        top: 164px;
        left: 46px;
        width: 334px;
        height: 678px;
      }

      .macbook-slot {
        top: 204px;
        left: 430px;
        width: 1051px;
        height: 617px;
      }

      .phone-device {
        filter: drop-shadow(0 38px 42px rgba(0, 0, 0, 0.58));
        transform: scale(0.78);
        transform-origin: top left;
      }

      .macbook-device {
        filter: drop-shadow(0 42px 44px rgba(0, 0, 0, 0.5));
        transform: scale(1.42);
        transform-origin: top left;
      }

      .phone-device .device-screen,
      .macbook-device .device-screen {
        object-fit: contain;
      }

      .phone-device .device-screen {
        background: #071022;
      }

      .device-label {
        position: absolute;
        right: 62px;
        bottom: 48px;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(235, 241, 255, 0.68);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .device-label span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #35dcff;
        box-shadow: 0 0 16px #35dcff;
      }
    </style>
  </head>
  <body>
    <div class="brand">CALL-IN</div>
    <div class="floor-glow"></div>

    <div class="phone-slot" aria-label="Audience interaction shown on an iPhone">
      <div class="device device-iphone-14-pro device-black phone-device">
        <div class="device-frame">
          <img class="device-screen" src="./demo-audience.jpg" alt="Call-in audience page" />
        </div>
        <div class="device-stripe"></div>
        <div class="device-header"></div>
        <div class="device-sensors"></div>
        <div class="device-btns"></div>
        <div class="device-power"></div>
        <div class="device-home"></div>
      </div>
    </div>

    <div class="macbook-slot" aria-label="Presenter deck and dashboard shown on a MacBook Pro">
      <div class="device device-macbook-pro device-spacegray macbook-device">
        <div class="device-frame">
          <img class="device-screen" src="./demo-presenter.jpg" alt="Call-in presenter dashboard" />
        </div>
        <div class="device-stripe"></div>
        <div class="device-header"></div>
        <div class="device-sensors"></div>
        <div class="device-btns"></div>
        <div class="device-power"></div>
        <div class="device-home"></div>
      </div>
    </div>

    <div class="device-label"><span></span>Presenter + audience, one realtime room</div>
  </body>
</html>
